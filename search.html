<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Daily AI Briefing</title>
  <meta name="description" content="Search every article ever featured in the Daily AI Briefing, by keyword, source, or date.">
  <style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:    #1a1410;
  --paper:  #f7f3ec;
  --cream:  #ede8df;
  --accent: #c0392b;
  --muted:  #7a6f65;
  --rule:   #c8bfb0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }

.page-wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.topnav {
  display: flex;
  gap: 24px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 20px;
  margin-bottom: 40px;
}
.topnav a { color: var(--muted); }
.topnav a:hover { color: var(--accent); text-decoration: none; }
.topnav a.active { color: var(--ink); font-weight: 500; }

.masthead { margin-bottom: 48px; }
.masthead-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.masthead h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 700;
  line-height: 1.1;
}
.masthead-rule {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 20px 0;
  color: var(--accent);
  font-size: 18px;
}
.masthead-rule::before,
.masthead-rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.footer {
  text-align: center;
  padding-top: 40px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
  border-top: 1px solid var(--rule);
  margin-top: 60px;
}


.page-wrap { max-width: 760px; }
.search-box { display: flex; gap: 8px; margin-bottom: 12px; }
.search-box input[type="text"] {
  flex: 1;
  font: inherit;
  font-size: 16px;
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
}
.search-box button {
  font: inherit;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0 20px;
  border: none;
  border-radius: 4px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.search-box button:hover { opacity: 0.9; }

.advanced-toggle {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
  margin-bottom: 20px;
  text-decoration: underline dotted;
}
.advanced-toggle:hover { color: var(--accent); }

.advanced-panel {
  display: none;
  background: var(--cream);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 20px 24px;
  margin-bottom: 32px;
  gap: 20px;
}
.advanced-panel.open { display: flex; flex-wrap: wrap; }
.advanced-field { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
.advanced-field.sources-field { flex: 1 1 100%; }
.advanced-field label.field-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.advanced-field input[type="date"] {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 4px;
}
.source-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.src-check { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

.results-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.result { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dotted var(--rule); }
.result:last-child { border-bottom: none; }
.result-title { font-size: 16px; font-weight: 500; line-height: 1.4; }
.result-title:hover { color: var(--accent); }
.result-meta { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 0.02em; }
.result-excerpt { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
  </style>
</head>
<body>
<div class="page-wrap">
  <nav class="topnav"><a href="index.html" class="">All Briefings</a><a href="sources.html" class="">Sources</a><a href="blog/index.html" class="">Blog</a><a href="search.html" class="active">Search</a></nav>

  <header class="masthead">
    <p class="masthead-label">Search</p>
    <h1>Find an article</h1>
    <p class="masthead-sub" style="margin-top:12px;font-size:15px;color:var(--muted)">Search across every briefing ever published, by keyword, source, or date.</p>
  </header>

  <form id="search-form">
    <div class="search-box">
      <input type="text" id="q" placeholder="Search titles, summaries, or source names…" autocomplete="off">
      <button type="submit">Search</button>
    </div>
    <button type="button" class="advanced-toggle" id="advanced-toggle">Advanced options ▾</button>
    <div class="advanced-panel" id="advanced-panel">
      <div class="advanced-field">
        <label class="field-label" for="date-from">From date</label>
        <input type="date" id="date-from">
      </div>
      <div class="advanced-field">
        <label class="field-label" for="date-to">To date (or same as From for a single day)</label>
        <input type="date" id="date-to">
      </div>
      <div class="advanced-field sources-field">
        <label class="field-label">News sites (none checked = all)</label>
        <div class="source-checks"><label class="src-check"><input type="checkbox" value="arstechnica"> Ars Technica AI</label><label class="src-check"><input type="checkbox" value="bloomberg"> Bloomberg Technology</label><label class="src-check"><input type="checkbox" value="foxbusiness"> Fox Business Technology</label><label class="src-check"><input type="checkbox" value="hackernews"> Hacker News</label><label class="src-check"><input type="checkbox" value="mit"> MIT Technology Review</label><label class="src-check"><input type="checkbox" value="nyt"> NYT Technology</label><label class="src-check"><input type="checkbox" value="siliconvalley"> Silicon Valley News</label><label class="src-check"><input type="checkbox" value="techcrunch"> TechCrunch AI</label><label class="src-check"><input type="checkbox" value="techradar"> TechRadar</label><label class="src-check"><input type="checkbox" value="verge"> The Verge</label><label class="src-check"><input type="checkbox" value="venturebeat"> VentureBeat</label><label class="src-check"><input type="checkbox" value="wired"> Wired</label><label class="src-check"><input type="checkbox" value="zdnet"> ZDNet AI</label></div>
      </div>
    </div>
  </form>

  <p class="results-meta" id="results-meta">Loading article index…</p>
  <div id="results"></div>

  <footer class="footer">Daily AI Briefing · Search</footer>
</div>
<script src="search.js" defer></script>
</body>
</html>
